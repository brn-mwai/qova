name: Publish SDK

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/publish-sdk.yml"

jobs:
  publish:
    name: Build & Publish @brnmwai/qova-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: sdk

      - name: Build
        run: bun run build
        working-directory: sdk

      - name: Run tests
        run: bun run test
        working-directory: sdk

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: sdk
        run: |
          # Swap to the public package name for publishing
          sed -i 's/"name": "@qova\/core"/"name": "@brnmwai\/qova-core"/' package.json

          # Check current published version
          PUBLISHED=$(npm view @brnmwai/qova-core version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")

          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "Version $LOCAL already published, skipping."
          else
            npm publish --access public
            echo "Published @brnmwai/qova-core@$LOCAL"
          fi

          # Revert the name change (keep git clean)
          sed -i 's/"name": "@brnmwai\/qova-core"/"name": "@qova\/core"/' package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
