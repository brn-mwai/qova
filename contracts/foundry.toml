[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@chainlink/contracts/=lib/ccip/contracts/",
    "@chainlink/contracts-ccip/=lib/ccip/contracts/",
]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "https://mainnet.base.org"
skale_base = "https://skale-base.skalenodes.com/v1/base"
tenderly = "${TENDERLY_VIRTUAL_TESTNET_RPC}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
tenderly = { key = "${TENDERLY_ACCESS_KEY}", url = "${TENDERLY_VERIFICATION_URL}" }
