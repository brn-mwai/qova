[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qova-crewai"
version = "0.1.0"
description = "Qova reputation and credit scoring tools for CrewAI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Qova Engineering", email = "eng@qova.cc" },
]
keywords = ["qova", "crewai", "ai-agents", "reputation", "credit-score", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://qova.cc"
Documentation = "https://docs.qova.cc/integrations/crewai"
Repository = "https://github.com/brnmwai/qova"
Issues = "https://github.com/brnmwai/qova/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qova_crewai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
