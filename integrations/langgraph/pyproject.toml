[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qova-langchain"
version = "0.1.0"
description = "LangChain/LangGraph tools for Qova - the financial credit bureau for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Qova Engineering", email = "eng@qova.cc" },
]
keywords = [
    "langchain",
    "langgraph",
    "qova",
    "ai-agents",
    "reputation",
    "credit-scoring",
    "blockchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://qova.cc"
Documentation = "https://docs.qova.cc/integrations/langchain"
Repository = "https://github.com/brnmwai/qova"
Issues = "https://github.com/brnmwai/qova/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qova_langchain"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
