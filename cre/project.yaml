# ─── Tenderly Virtual TestNet ────────────────────────────────
# Fork of Base Sepolia with unlimited faucet, real-time state sync,
# built-in debugger, and transaction explorer.
# Setup: Create Virtual TestNet at https://dashboard.tenderly.co
#        forking Base Sepolia (chain 84532), then set the RPC URL below.

tenderly-reputation-oracle:
  config:
    chainSelectorName: "ethereum-testnet-sepolia-base-1"
    reputationRegistryAddress: "${TENDERLY_REPUTATION_REGISTRY}"
    transactionValidatorAddress: "${TENDERLY_TRANSACTION_VALIDATOR}"
    budgetEnforcerAddress: "${TENDERLY_BUDGET_ENFORCER}"
    consumerContractAddress: "${TENDERLY_REPUTATION_REGISTRY}"
    gasLimit: "500000"
